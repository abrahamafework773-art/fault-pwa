<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">

<title>Aircraft Fault History & Follow-Up</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{background:#f7f9fc;padding:20px}
.card{border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.table-responsive{max-height:520px}
.badge-active{background:#198754}
.badge-closed{background:#6c757d}
</style>
</head>
<body>

<div class="container">

<h3>Aircraft Fault History & Follow-Up</h3>
<p class="text-muted">Live | Editable | Google Sheet Backend</p>

<!-- ================= FORM ================= -->
<div class="card p-3 mb-3">
<form id="faultForm" class="row g-2">

<div class="col-md-3">
<select id="aircraft" required></select>
</div>

<div class="col-md-4">
<input id="fault" class="form-control" placeholder="Fault Description" required>
</div>

<div class="col-md-3">
<input id="action" class="form-control" placeholder="Follow-up / Action Taken">
</div>

<div class="col-md-2">
<div class="btn-group w-100">
<input type="radio" class="btn-check" name="status" id="stActive" value="ACTIVE" checked>
<label class="btn btn-outline-success" for="stActive">ACTIVE</label>

<input type="radio" class="btn-check" name="status" id="stClosed" value="CLOSED">
<label class="btn btn-outline-secondary" for="stClosed">CLOSED</label>
</div>
</div>

<div class="col-12 d-flex gap-2 mt-2">
<button class="btn btn-primary">Save</button>
<button type="button" onclick="faultForm.reset()" class="btn btn-secondary">Reset</button>
<span class="ms-auto">Records: <b id="count">0</b></span>
</div>

</form>
</div>

<!-- ================= TABLE ================= -->
<div class="card p-3">

<div class="d-flex gap-2 mb-2 flex-wrap">
<input id="searchInput" class="form-control form-control-sm w-auto" placeholder="Search">

<select id="filterAircraft" class="form-select form-select-sm w-auto">
<option value="">All Aircraft</option>
</select>

<select id="filterStatus" class="form-select form-select-sm w-auto">
<option value="ACTIVE" selected>Active Only</option>
<option value="">All</option>
<option value="CLOSED">Closed Only</option>
</select>

<button class="btn btn-sm btn-outline-success" onclick="exportExcel()">
<i class="bi bi-file-earmark-excel"></i> Excel
</button>

<button class="btn btn-sm btn-outline-danger" onclick="deleteSelected()">
<i class="bi bi-trash"></i> Delete Selected
</button>
</div>

<div class="table-responsive">
<table class="table table-striped" id="faultTable">
<thead>
<tr>
<th><input type="checkbox" onclick="toggleAll(this)"></th>
<th>#</th>
<th>Aircraft</th>
<th>Fault</th>
<th>Follow-up</th>
<th>Status</th>
<th>Updated</th>
<th></th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<div class="toast-container position-fixed top-0 end-0 p-3"></div>

<script>
/* ================= CONFIG ================= */
const URL="https://script.google.com/macros/s/AKfycbyDz7U98PrJS33ip43xCdtHvYtHB06us7XIR1qZlVZnF-2swFpjy9QFgUmmTFAnwNpk/exec";

/* ================= STATE ================= */
let editId=null, faults=[], aircraftSelect;

/* ================= DATA ================= */
const aircraftList=[
"ET-ALO","ET-ALP","ET-BBE","ET-BBF","ET-ANN","ET-ANO","ET-ANP","ET-ANQ","ET-ANR",
"ET-AQL","ET-APX","ET-APY","ET-ASK","ET-ASL","ET-BBG","ET-APS","ET-APU",
"ET-ARI","ET-ARJ","ET-ARK","ET-AVN","ET-AVQ","ET-AVT","ET-AWE","ET-BAA","ET-BAB","ET-BAC"
];

/* ================= HELPERS ================= */
const dateOnly=d=>d?new Date(d).toISOString().split('T')[0]:'';

function toast(msg,type='primary'){
const t=document.createElement('div');
t.className=`toast text-bg-${type}`;
t.innerHTML=`<div class="toast-body">${msg}</div>`;
document.querySelector('.toast-container').appendChild(t);
new bootstrap.Toast(t,{delay:2500}).show();
}

/* ================= INIT ================= */
window.onload=()=>{
aircraftList.forEach(a=>{
aircraft.innerHTML+=`<option>${a}</option>`;
filterAircraft.innerHTML+=`<option>${a}</option>`;
});
aircraftSelect=new TomSelect('#aircraft',{create:false});
load();
setInterval(load,5000);
};

/* ================= FETCH ================= */
async function load(){
const r=await fetch(URL);
const d=await r.json();
faults=d.slice(1).map(r=>({
id:r[0],
aircraft:r[1],
fault:r[2],
action:r[3],
status:r[4]||'ACTIVE',
updated:r[5]
}));
render();
}

/* ================= SAVE ================= */
faultForm.onsubmit=async e=>{
e.preventDefault();
const status=document.querySelector('input[name="status"]:checked').value;
const data={
id:editId,
aircraft:aircraft.value,
fault:fault.value,
action:action.value,
status
};
await fetch(URL,{method:'POST',body:JSON.stringify(data)});
toast(editId?'Updated':'Added','success');
editId=null;
faultForm.reset();
aircraftSelect.clear();
document.getElementById('stActive').checked=true;
load();
};

/* ================= RENDER ================= */
function render(){
const q=searchInput.value.toLowerCase();
const fa=filterAircraft.value;
const fs=filterStatus.value;
const tb=document.querySelector('#faultTable tbody');
tb.innerHTML='';
faults.filter(f=>{
return (!fa||f.aircraft===fa)
&& (!fs||f.status===fs)
&& JSON.stringify(f).toLowerCase().includes(q);
}).forEach((f,i)=>{
tb.innerHTML+=`
<tr>
<td><input type="checkbox" class="rowCheck" value="${f.id}"></td>
<td>${i+1}</td>
<td>${f.aircraft}</td>
<td>${f.fault}</td>
<td>${f.action||''}</td>
<td><span class="badge ${f.status==='ACTIVE'?'badge-active':'badge-closed'}">${f.status}</span></td>
<td>${dateOnly(f.updated)}</td>
<td>
<button class="btn btn-sm btn-outline-primary" onclick="edit('${f.id}')">
<i class="bi bi-pencil"></i>
</button>
<button class="btn btn-sm btn-outline-danger" onclick="del('${f.id}')">
<i class="bi bi-trash"></i>
</button>
</td>
</tr>`;
});
count.textContent=tb.children.length;
}

/* ================= EDIT ================= */
window.edit=id=>{
const f=faults.find(x=>x.id==id);
if(!f)return;
editId=id;
aircraftSelect.setValue(f.aircraft,true);
fault.value=f.fault;
action.value=f.action;
document.getElementById(f.status==='CLOSED'?'stClosed':'stActive').checked=true;
toast('Editing '+f.aircraft,'info');
};

/* ================= DELETE ================= */
window.del=async id=>{
if(!confirm('Delete record?'))return;
await fetch(URL,{method:'POST',body:JSON.stringify({id,delete:true})});
toast('Deleted','warning');
load();
};

/* ================= FILTER ================= */
[searchInput,filterAircraft,filterStatus].forEach(e=>e.oninput=render);

/* ================= EXTRA ================= */
function toggleAll(el){
document.querySelectorAll('.rowCheck').forEach(c=>c.checked=el.checked);
}

async function deleteSelected(){
const ids=[...document.querySelectorAll('.rowCheck:checked')].map(c=>c.value);
if(!ids.length)return alert('No rows selected');
if(!confirm(`Delete ${ids.length} records?`))return;
for(const id of ids){
await fetch(URL,{method:'POST',body:JSON.stringify({id,delete:true})});
}
toast(`${ids.length} deleted`,'danger');
load();
}

function exportExcel(){
const wb=XLSX.utils.book_new();
const ws=XLSX.utils.table_to_sheet(document.getElementById('faultTable'));
XLSX.utils.book_append_sheet(wb,ws,'Fault History');
XLSX.writeFile(wb,'Aircraft_Fault_History.xlsx');
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
